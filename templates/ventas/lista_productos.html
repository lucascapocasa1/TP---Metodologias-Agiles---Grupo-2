{% extends "base_admin.html" %}
{% block titulo %}Catálogo de Productos{% endblock %}
{% block contenido %}
<div class="admin-panel">
    <div class="admin-header">
        <div class="admin-header-left">
            <h1><i class="bi bi-box-seam"></i> Catálogo de Productos</h1>
            <p class="admin-subtitle">Alta, edición y baja de productos y precios</p>
        </div>
        <a href="{% url 'ventas:agregar_producto' %}" class="btn btn-admin-primary">
            <i class="bi bi-plus-lg"></i> Nuevo Producto
        </a>
    </div>

    <!-- Búsqueda en tiempo real (HU-05): HTMX reemplaza solo la tabla -->
    <div class="admin-filters">
        <form class="filter-form" role="search" onsubmit="return false">
            <div class="filter-group">
                <div class="search-box">
                    <i class="bi bi-search"></i>
                    <input type="text"
                           name="buscar"
                           value="{{ busqueda }}"
                           placeholder="Buscar por nombre, descripción o código de barras..."
                           class="admin-input"
                           autocomplete="off"
                           hx-get="{% url 'ventas:lista_productos' %}"
                           hx-trigger="keyup changed delay:300ms, search"
                           hx-vals='{"orden": "{{ orden }}", "direccion": "{{ direccion }}"}'
                           hx-target="#contenedor-tabla"
                           hx-swap="innerHTML">
                </div>
            </div>
        </form>
        <form id="escaner-alta" class="filter-form" autocomplete="off">
            <div class="filter-group">
                <div class="search-box">
                    <i class="bi bi-upc-scan"></i>
                    <input type="text"
                           id="escaner-alta-input"
                           placeholder="Escanear código para dar de alta o editar..."
                           class="admin-input"
                           autocomplete="off"
                           aria-label="Escanear código de barras para registrar producto">
                </div>
            </div>
            <button type="submit" class="btn btn-kiosco-outline">
                <i class="bi bi-upc-scan"></i> Registrar por código
            </button>
        </form>
    </div>

    <div class="admin-table-container" id="contenedor-tabla">
        {% include "ventas/_productos_tabla.html" %}
    </div>
</div>

<script>
(function () {
    // Registro con lector desde el catálogo: se escanea el código y Enter.
    // Si ya existe → abre la edición; si no → abre el alta precargada.
    var form = document.getElementById('escaner-alta');
    if (!form) return;
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var codigo = document.getElementById('escaner-alta-input').value.trim();
        if (!codigo) return;
        fetch("{% url 'ventas:buscar_por_codigo' %}?codigo=" + encodeURIComponent(codigo), {
            headers: {"X-Requested-With": "XMLHttpRequest"}
        }).then(function (r) { return r.json(); }).then(function (data) {
            if (data.existe) {
                window.location.href = data.url_editar;
            } else {
                window.location.href = "{% url 'ventas:agregar_producto' %}?codigo=" + encodeURIComponent(codigo);
            }
        }).catch(function () {
            window.location.href = "{% url 'ventas:agregar_producto' %}?codigo=" + encodeURIComponent(codigo);
        });
    });
})();
</script>
{% endblock %}
