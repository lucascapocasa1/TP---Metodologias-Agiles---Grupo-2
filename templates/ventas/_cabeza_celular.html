<script>
(function () {
    // Mismo tema que el resto del sistema (ver base.html).
    var t = localStorage.getItem('kiosco-tema');
    if (t === 'oscuro' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
    document.documentElement.setAttribute('data-tema', 'neon');
})();
</script>
