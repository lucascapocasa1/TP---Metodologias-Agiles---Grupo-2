<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Kiosco{% endblock %} — Sistema Kiosco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar navbar-expand-lg kiosco-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'usuarios:post_login' %}">
                <span class="brand-icon">&#x1F3EA;</span>
                <span class="brand-text">Kiosco</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <div class="user-info">
                    <span class="user-name">{{ user.first_name|default:user.username }}</span>
                    {% if user.groups.first %}
                        <span class="badge-rol">{{ user.groups.first.name }}</span>
                    {% endif %}
                    {% if user.is_superuser %}
                        <span class="badge-superuser">Admin</span>
                    {% endif %}
                </div>
                <form method="post" action="{% url 'usuarios:logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn-salir">Salir</button>
                </form>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="{% if user.is_authenticated %}container py-4{% endif %}">
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
