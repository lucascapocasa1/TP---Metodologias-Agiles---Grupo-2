<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Kiosco{% endblock %} — Sistema Kiosco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
    <script>
    (function() {
        var t = localStorage.getItem('kiosco-tema');
        if (t === 'oscuro' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
    </script>
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar navbar-expand-lg kiosco-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'usuarios:post_login' %}">
                <span class="brand-icon"><i class="bi bi-shop"></i></span>
                <span class="brand-text">Kiosco</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <div class="user-info">
                    <span class="user-name">{{ user.first_name|default:user.username }}</span>
                    {% if user.groups.first %}
                        <span class="badge-rol">{{ user.groups.first.name }}</span>
                    {% endif %}
                    {% if user.is_superuser %}
                        <span class="badge-superuser">Admin</span>
                    {% endif %}
                </div>
                <button type="button" class="btn-dark-toggle" id="darkToggle" title="Cambiar tema">
                    <i class="bi bi-moon-fill"></i>
                </button>
                <form method="post" action="{% url 'usuarios:logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn-salir">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </button>
                </form>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="{% if user.is_authenticated %}container py-4{% endif %}">
        {% block contenido %}{% endblock %}
    </main>

    <script>
    (function() {
        var toggle = document.getElementById('darkToggle');
        if (!toggle) return;

        var html = document.documentElement;
        var icon = toggle.querySelector('i');
        var KEY = 'kiosco-tema';

        function aplicar(tema) {
            if (tema === 'oscuro') {
                html.setAttribute('data-theme', 'dark');
                icon.className = 'bi bi-sun-fill';
            } else {
                html.removeAttribute('data-theme');
                icon.className = 'bi bi-moon-fill';
            }
        }

        var guardado = localStorage.getItem(KEY);
        if (guardado) {
            aplicar(guardado);
        }

        toggle.addEventListener('click', function() {
            var esOscuro = html.getAttribute('data-theme') === 'dark';
            if (esOscuro) {
                html.removeAttribute('data-theme');
                localStorage.setItem(KEY, 'claro');
                icon.className = 'bi bi-moon-fill';
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem(KEY, 'oscuro');
                icon.className = 'bi bi-sun-fill';
            }
        });
    })();
    </script>
</body>
</html>
