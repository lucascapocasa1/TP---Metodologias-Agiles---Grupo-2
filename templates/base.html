<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Kiosco{% endblock %} - Sistema Kiosco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% if user.is_authenticated %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">🏪 Kiosco</span>
            <div class="d-flex align-items-center gap-3">
                <span class="text-light small">
                    {{ user.first_name|default:user.username }}
                    {% if user.groups.first %}<span class="badge bg-secondary">{{ user.groups.first.name }}</span>{% endif %}
                    {% if user.is_superuser %}<span class="badge bg-warning text-dark">Superusuario</span>{% endif %}
                </span>
                <form method="post" action="{% url 'usuarios:logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Salir</button>
                </form>
            </div>
        </div>
    </nav>
    {% endif %}

    <div class="container py-4">
        {% block contenido %}{% endblock %}
    </div>
</body>
</html>
