<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Kiosco{% endblock %} — Sistema Kiosco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;600;700&family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&family=Righteous&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
    <script>
    (function() {
        var t = localStorage.getItem('kiosco-tema');
        if (t === 'oscuro' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        var e = localStorage.getItem('kiosco-estilo');
        var validos = ['cartelera', 'ticket', 'neon'];
        if (validos.indexOf(e) === -1) {
            e = 'cartelera';
            localStorage.setItem('kiosco-estilo', e);
        }
        document.documentElement.setAttribute('data-tema', e);
    })();
    </script>
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="kiosco-navbar">
        <div class="kiosco-navbar-inner">
            <a class="brand" href="{% url 'usuarios:post_login' %}">
                <i class="bi bi-shop brand-icon" aria-hidden="true"></i>
                <span class="brand-text">Kiosco</span>
            </a>
            <div class="nav-acciones">
                <div class="user-info">
                    <span class="user-name">{{ user.first_name|default:user.username }}</span>
                    {% if user.groups.first %}
                        <span class="badge-rol">{{ user.groups.first.name }}</span>
                    {% endif %}
                    {% if user.is_superuser %}
                        <span class="badge-superuser">Admin</span>
                    {% endif %}
                </div>
                <button type="button" class="btn-tema" id="estiloToggle" title="Cambiar el estilo visual" aria-label="Cambiar el estilo visual">
                    <i class="bi bi-palette-fill" aria-hidden="true"></i>
                    <span class="estilo-nombre">Cartelera</span>
                </button>
                <button type="button" class="btn-tema" id="darkToggle" title="Cambiar tema" aria-label="Cambiar entre tema claro y oscuro">
                    <i class="bi bi-moon-fill"></i>
                </button>
                <form method="post" action="{% url 'usuarios:logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn-salir">
                        <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Salir
                    </button>
                </form>
            </div>
        </div>
        <div class="toldo-filete" aria-hidden="true"></div>
    </nav>
    {% endif %}

    <main class="{% if user.is_authenticated %}kiosco-main{% endif %}">
        {% block contenido %}{% endblock %}
    </main>

    <script>
    (function() {
        var toggle = document.getElementById('darkToggle');
        if (!toggle) return;

        var html = document.documentElement;
        var icon = toggle.querySelector('i');
        var KEY = 'kiosco-tema';

        function aplicar(tema) {
            if (tema === 'oscuro') {
                html.setAttribute('data-theme', 'dark');
                icon.className = 'bi bi-sun-fill';
            } else {
                html.removeAttribute('data-theme');
                icon.className = 'bi bi-moon-fill';
            }
        }

        var guardado = localStorage.getItem(KEY);
        if (guardado) {
            aplicar(guardado);
        }

        toggle.addEventListener('click', function() {
            var esOscuro = html.getAttribute('data-theme') === 'dark';
            if (esOscuro) {
                html.removeAttribute('data-theme');
                localStorage.setItem(KEY, 'claro');
                icon.className = 'bi bi-moon-fill';
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem(KEY, 'oscuro');
                icon.className = 'bi bi-sun-fill';
            }
        });
    })();
    </script>

    <script>
    (function() {
        var btn = document.getElementById('estiloToggle');
        if (!btn) return;

        var nombre = btn.querySelector('.estilo-nombre');
        var ORDEN = ['cartelera', 'ticket', 'neon'];
        var NOMBRES = { cartelera: 'Cartelera', ticket: 'Ticket', neon: 'Neón' };
        var actual = document.documentElement.getAttribute('data-tema') || 'cartelera';

        function aplicar(estilo) {
            document.documentElement.setAttribute('data-tema', estilo);
            if (nombre) {
                nombre.textContent = NOMBRES[estilo] || 'Cartelera';
            }
        }

        aplicar(actual);

        btn.addEventListener('click', function() {
            var i = ORDEN.indexOf(actual);
            actual = ORDEN[(i + 1) % ORDEN.length];
            localStorage.setItem('kiosco-estilo', actual);
            aplicar(actual);
        });
    })();
    </script>
</body>
</html>
