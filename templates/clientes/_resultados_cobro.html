{% if coincidencias %}
<div class="admin-table-container">
    <table class="admin-table">
        <tbody>
            {% for c in coincidencias %}
            <tr>
                <td>
                    <div class="user-cell">
                        <span class="user-username">{{ c.nombre_completo }}</span>
                        <span class="cobro-codigo">DNI {{ c.dni }} · {{ c.puntos }} pts</span>
                    </div>
                </td>
                <td class="actions-cell">
                    <div class="action-buttons">
                        <button type="button"
                                class="btn btn-admin-primary"
                                title="Asociar a la venta"
                                hx-post="{% url 'clientes:asociar' %}"
                                hx-target="#carrito-region"
                                hx-swap="innerHTML"
                                hx-vals='{"cliente_id": "{{ c.pk }}"}'>
                            <i class="bi bi-person-check"></i> Asociar
                        </button>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% elif consulta|length >= 2 %}
<div class="admin-empty">
    <p>No hay clientes para «{{ consulta }}».</p>
</div>
{% endif %}
