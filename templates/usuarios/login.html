{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-brand">
            <div class="login-brand-icon">&#x1F3EA;</div>
            <h1>Sistema Kiosco</h1>
            <p>Ingresá con tu usuario y contraseña</p>
        </div>

        {% if form.errors %}
            <div class="kiosco-alert kiosco-alert-danger mb-3">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}
            <div class="form-group">
                <label class="kiosco-label">Usuario</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label class="kiosco-label">Contraseña</label>
                {{ form.password }}
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-kiosco login-form btn-submit">Ingresar</button>
        </form>
    </div>
</div>
{% endblock %}
