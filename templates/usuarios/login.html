{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-sm" style="width: 100%; max-width: 380px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-1">🏪 Sistema Kiosco</h3>
            <p class="text-center text-muted small mb-4">Ingresá con tu usuario y contraseña</p>

            {% if form.errors %}
                <div class="alert alert-danger py-2 small">
                    Usuario o contraseña incorrectos.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    {{ form.password }}
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
