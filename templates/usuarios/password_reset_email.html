<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="font-family: sans-serif; background-color: #081822; color: #ffffff; padding: 20px;">
    <div style="max-width: 500px; margin: 0 auto; background-color: #0d2230; padding: 30px; border-radius: 10px; border: 1px solid #00C8E0;">
        <h2 style="color: #00C8E0; margin-top: 0;">Restablecer contraseña en Norvex</h2>
        <p>Hola,</p>
        <p>Recibimos una solicitud para restablecer la contraseña de tu cuenta en el sistema Norvex.</p>
        <p>Hacé clic en el siguiente botón para elegir una nueva contraseña:</p>
        <div style="text-align: center; margin: 30px 0;">
            <a href="{{ protocol }}://{{ domain }}{% url 'usuarios:password_reset_confirm' uidb64=uid token=token %}" 
               style="background-color: #00C8E0; color: #081822; padding: 12px 24px; text-decoration: none; font-weight: bold; border-radius: 5px; display: inline-block;">
                Restablecer mi contraseña
            </a>
        </div>
        <p style="font-size: 12px; color: #888888;">Si no solicitaste este cambio, podés ignorar este correo de forma segura.</p>
    </div>
</body>
</html>
