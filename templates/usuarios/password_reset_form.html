{% extends "base.html" %}
{% block titulo %}Recuperar contraseña{% endblock %}

{% block contenido %}
<div class="container mt-5" style="max-width: 450px;">
    <div class="card bg-dark text-light border-info shadow">
        <div class="card-body p-4">
            <h3 class="card-title text-center text-info mb-3">Recuperar contraseña</h3>
            <p class="text-muted small">
                Ingresá tu correo electrónico registrado y te enviaremos las instrucciones por e-mail para restablecerla.
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_email" class="form-label">Correo electrónico</label>
                    <input type="email" name="email" id="id_email" class="form-control kiosco-input" required autocomplete="email">
                </div>
                <button type="submit" class="btn btn-info w-100 fw-bold">Enviar enlace de recuperación</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'usuarios:login' %}" class="text-info text-decoration-none small">Volver al inicio de sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
