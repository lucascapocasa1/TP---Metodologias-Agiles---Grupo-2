{% extends "base.html" %}
{% block titulo %}Contraseña restablecida{% endblock %}

{% block contenido %}
<div class="container mt-5" style="max-width: 450px;">
    <div class="card bg-dark text-light border-info shadow">
        <div class="card-body p-4 text-center">
            <h3 class="card-title text-info mb-3">¡Contraseña restablecida!</h3>
            <p class="text-muted small mb-4">
                Tu contraseña se actualizó correctamente. Ya podés iniciar sesión con tus nuevas credenciales.
            </p>
            <a href="{% url 'usuarios:login' %}" class="btn btn-info w-100 fw-bold">Iniciar sesión</a>
        </div>
    </div>
</div>
{% endblock %}
